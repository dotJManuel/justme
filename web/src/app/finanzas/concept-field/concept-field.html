<input
  #el
  [attr.list]="listId"
  [attr.aria-label]="label()"
  [placeholder]="placeholder()"
  [attr.maxlength]="maxLength()"
  autocomplete="off"
  [value]="shown()"
  (input)="onInput(el)"
  (change)="onChange(el)"
/>
<datalist [id]="listId">
  @for (o of suggestions(); track o.id) {
    <option [value]="o.name"></option>
  }
</datalist>
