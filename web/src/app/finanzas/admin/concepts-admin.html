<section class="card" [class.s-steel]="scope() === 'gasto'" [class.s-violet]="scope() === 'movimiento'" [class.s-sage]="scope() === 'familia'" [style.--cols]="cols">
  <h2>{{ title() }}</h2>
  <p class="hint">{{ help() }}</p>

  <div class="scroll">
  <div class="grid head" aria-hidden="true">
    <span>Nombre</span>
    <span>Activo</span>
    <span></span>
  </div>

  @for (c of concepts(); track c.id) {
    <div class="grid row" [class.off]="!c.active">
      <div class="c" data-l="Nombre">
        <input #n aria-label="Nombre del concepto" [attr.maxlength]="maxLength()" [value]="c.name" (change)="setName(c, n)" />
      </div>
      <div class="c" data-l="Activo">
        <label class="switch">
          <input type="checkbox" [checked]="c.active" (change)="toggle(c)" [attr.aria-label]="(c.active ? 'Desactivar ' : 'Activar ') + c.name" />
          <span class="muted">{{ usageText(c) }}</span>
        </label>
      </div>
      <button type="button" class="icon x" [attr.aria-label]="'Eliminar ' + c.name" (click)="remove(c)">✕</button>
    </div>
  } @empty {
    <p class="hint">Todavía no hay conceptos. Agrega el primero abajo.</p>
  }
  </div>

  <div class="foot">
  <form class="grid row add" (ngSubmit)="add()">
    <div class="c" data-l="Nombre">
      <input name="name" aria-label="Nuevo concepto" placeholder="Nuevo concepto" [attr.maxlength]="maxLength()" [ngModel]="name()" (ngModelChange)="name.set($event)" />
    </div>
    <span></span>
    <button type="submit" class="primary x" [disabled]="!name().trim()">Agregar</button>
  </form>
  </div>
</section>
