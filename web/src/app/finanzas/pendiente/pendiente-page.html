<div class="toolbar"><app-export-button label="Exportar todo a Excel" (click)="exportAll()" /></div>

<h2 data-section class="sec s-violet">Dinero que me deben</h2>
<app-debts />

<h2 data-section class="sec s-sage">Dinero con familia</h2>
<section class="summary" aria-label="Resumen con familia">
  <div class="tile s-sage">
    <span class="lbl">Total recibido</span>
    <b>{{ money(totals().recibido) }}</b>
  </div>
  <div class="tile s-rose">
    <span class="lbl">Total dado</span>
    <b>{{ money(totals().dado) }}</b>
  </div>
  <div class="tile s-teal" [class.neg]="totals().left < 0">
    <span class="lbl">Me queda</span>
    <b>{{ money(totals().left) }}</b>
  </div>
</section>
<app-family-list data-section direction="recibido" />
<app-family-list data-section direction="dado" />
