<dialog #dlg class="dlg" aria-labelledby="stm-title" (close)="finish()" (cancel)="finish()" (click)="onBackdrop($event)">
  <div class="box">
    <div class="top">
      <h2 id="stm-title">Estado de cuenta de {{ statement().person }}</h2>
      <button type="button" class="x" aria-label="Cerrar" (click)="close()"><app-icon name="x" [size]="20" /></button>
    </div>

    <div class="sheet" [attr.aria-busy]="busy()">
      @if (imageUrl()) {
        <img [src]="imageUrl()" [alt]="text()" />
      } @else if (busy()) {
        <ui-skeleton height="260px" radius="0" />
      }
    </div>

    <div class="actions">
      <button uiBtn class="wide" type="button" [disabled]="!imageUrl()" (click)="shareImage()">Compartir imagen</button>
      <button uiBtn variant="secondary" type="button" (click)="whatsapp()">Texto por WhatsApp</button>
      <button uiBtn variant="secondary" type="button" (click)="copy()">Copiar texto</button>
      <button uiBtn variant="secondary" type="button" [disabled]="!imageUrl()" (click)="download()">Descargar imagen</button>
    </div>

    @if (message()) {
      <p class="msg" role="status">{{ message() }}</p>
    }
    <p class="hint">
      «Compartir imagen» abre la hoja de compartir del teléfono (ahí eliges WhatsApp y a quién). En computadora se
      descarga la imagen para que la adjuntes.
    </p>
  </div>
</dialog>
