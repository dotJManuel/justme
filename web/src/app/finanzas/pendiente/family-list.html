<section class="card" [style.--cols]="cols()">
  <h2>{{ title() }}</h2>

  <div class="grid head" aria-hidden="true">
    <span>{{ nameLabel() }}</span>
    @if (received()) {
      <span>De quién</span>
    }
    <span>Fecha</span>
    <span class="num">Monto</span>
    <span></span>
  </div>

  @for (m of rows(); track m.id) {
    <div class="grid row">
      <div class="c" [attr.data-l]="nameLabel()">
        <input #n [attr.aria-label]="nameLabel()" maxlength="80" [value]="m.name" (change)="setName(m, n)" />
      </div>
      @if (received()) {
        <div class="c" data-l="De quién">
          <input #p aria-label="De quién" maxlength="80" [value]="m.person" (change)="setPerson(m, p)" />
        </div>
      }
      <div class="c" data-l="Fecha">
        <input #d type="date" aria-label="Fecha" [value]="m.date ?? ''" (change)="setDate(m, d)" />
      </div>
      <div class="c" data-l="Monto">
        <input #a class="num" inputmode="decimal" aria-label="Monto" [value]="m.amount" (change)="setAmount(m, a)" />
      </div>
      <button type="button" class="icon x" [attr.aria-label]="'Eliminar ' + m.name" (click)="remove(m)">✕</button>
    </div>
  } @empty {
    <p class="hint">Todavía no hay registros.</p>
  }

  <div class="grid total">
    <span>Total</span>
    @if (received()) {
      <span></span>
    }
    <span></span>
    <div class="c" data-l="Monto"><div class="ro">{{ money(total()) }}</div></div>
    <span></span>
  </div>

  <form class="grid row add" (ngSubmit)="add()">
    <div class="c" [attr.data-l]="nameLabel()">
      <input name="name" [attr.aria-label]="'Nuevo: ' + nameLabel()" [placeholder]="nameLabel()" maxlength="80" [ngModel]="name()" (ngModelChange)="name.set($event)" />
    </div>
    @if (received()) {
      <div class="c" data-l="De quién">
        <input name="person" aria-label="Nuevo: De quién" placeholder="De quién" maxlength="80" [ngModel]="person()" (ngModelChange)="person.set($event)" />
      </div>
    }
    <div class="c" data-l="Fecha">
      <input name="date" type="date" aria-label="Fecha" [ngModel]="date()" (ngModelChange)="date.set($event)" />
    </div>
    <div class="c" data-l="Monto">
      <input name="amount" class="num" inputmode="decimal" aria-label="Monto" placeholder="0.00" [ngModel]="amount()" (ngModelChange)="amount.set($event)" />
    </div>
    <button type="submit" class="primary x" [disabled]="!canAdd()">Agregar</button>
  </form>
</section>
