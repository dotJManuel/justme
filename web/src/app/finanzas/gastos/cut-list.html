<section class="card s-steel" [style.--cols]="cols">
  <h2>{{ title() }}</h2>

  <div class="grid head" aria-hidden="true">
    <span>Periodo de corte</span>
    <span class="num">Monto del corte</span>
    <span class="num">Pagado</span>
    <span class="num">Pendiente</span>
  </div>

  <div class="grid row">
    <div class="c" data-l="Periodo de corte"><div class="ro period">{{ period().label }}</div></div>
    <div class="c" data-l="Monto del corte">
      <input #a class="num" inputmode="decimal" aria-label="Monto del corte" [value]="amount()" (change)="setAmount(a)" />
    </div>
    <div class="c" data-l="Pagado">
      <input #p class="num" inputmode="decimal" aria-label="Pagado" [value]="paid()" (change)="setPaid(p)" />
    </div>
    <div class="c" data-l="Pendiente">
      <div class="ro" [class.pos]="pending() <= 0" [class.neg]="pending() > 0">{{ money(pending()) }}</div>
    </div>
  </div>
</section>
