<section class="card s-steel">
  <h2>Nuevo gasto</h2>

  <form class="fgrid" [class.fix]="!isCard()" (ngSubmit)="add()">
    <label class="f-dest">
      Destino
      <select name="dest" [ngModel]="destValue()" (ngModelChange)="dest.set($event)">
        @for (o of options(); track o.value) {
          <option [value]="o.value">{{ o.label }}</option>
        }
      </select>
    </label>

    <label class="f-con">
      Concepto
      <app-concept-field [options]="conceptOptions()" [value]="concept()" [live]="true" (valueChange)="onConcept($event)" />
    </label>

    @if (isCard()) {
      <label class="f-dt">
        Fecha y hora
        <input name="purchased" type="datetime-local" [ngModel]="purchased()" (ngModelChange)="onPurchased($event)" />
      </label>
      <label class="f-am">
        A meses
        <input name="installment" placeholder="05/09" maxlength="20" [ngModel]="installment()" (ngModelChange)="installment.set($event)" />
      </label>
      <label class="f-tot">
        Monto total
        <input name="total" class="num" inputmode="decimal" placeholder="0.00" [ngModel]="total()" (ngModelChange)="total.set($event)" />
      </label>
    }

    <label class="f-pay">
      {{ isCard() ? 'Por pagar' : 'Monto mensual' }}
      <input name="amount" class="num" inputmode="decimal" placeholder="0.00" [ngModel]="amount()" (ngModelChange)="amount.set($event)" />
    </label>

    <button type="submit" class="primary f-btn" [disabled]="!canAdd()">Agregar</button>
  </form>

  @if (added()) {
    <p class="ok" role="status"><app-icon name="check" /> {{ added() }}</p>
  }
  <p class="hint long">
    Elige a dónde va el gasto. La fecha y hora se ponen solas al escribir el concepto y puedes cambiarlas. En Concepto
    puedes elegir uno de la lista o escribir uno nuevo. Si dejas el monto total vacío, se usa lo que se paga este mes.
  </p>
</section>
