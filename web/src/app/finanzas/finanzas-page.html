<div class="wrap">
  <div class="top">
    <h1>Mis finanzas</h1>
    <nav class="tabs" aria-label="Secciones de finanzas">
      <a routerLink="gastos" routerLinkActive="on">Gastos</a>
      <a routerLink="pendiente" routerLinkActive="on">Pendiente</a>
    </nav>
  </div>

  @if (fin.error()) {
    <p class="msg" role="alert">{{ fin.error() }}</p>
  }

  @if (fin.loaded()) {
    <router-outlet />
  } @else if (!fin.error()) {
    <p class="hint">Cargando…</p>
  }
</div>

@if (fin.loaded()) {
  <div class="jump">
    @if (!atTop()) {
      <button type="button" class="fab" aria-label="Sección anterior" (click)="step(-1)">↑</button>
    }
    @if (!atBottom()) {
      <button type="button" class="fab" aria-label="Siguiente sección" (click)="step(1)">↓</button>
    }
  </div>
}
