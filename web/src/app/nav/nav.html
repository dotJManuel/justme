<nav aria-label="Menú principal">
  <span class="brand">JustMe</span>
  <a routerLink="/" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }"><app-icon name="flame" /> Racha</a>
  <a routerLink="/finanzas" routerLinkActive="on"><app-icon name="wallet" /> Finanzas</a>
  <span class="gap"></span>
  <button
    type="button"
    class="quiet"
    [attr.aria-label]="theme.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    [title]="theme.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro'"
    (click)="theme.toggle()"
  >
    <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" />
  </button>
  <a routerLink="/admin" routerLinkActive="on" class="quiet" aria-label="Modo administrador" title="Modo administrador"><app-icon name="settings" /></a>
  <button type="button" class="quiet" aria-label="Salir" title="Salir" (click)="signOut()"><app-icon name="logout" /></button>
</nav>
