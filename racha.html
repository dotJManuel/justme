<title>Mi Racha de Estudio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: una columna tipo app móvil; arriba la racha (flama + número), luego la semana, luego las misiones del día. */
:root{
  --bg:#F3F4FA; --surface:#FFFFFF; --ink:#1E2240; --muted:#6A6F92; --line:#E1E3F0;
  --flame:#FF7A1A; --flame-2:#FFC233; --done:#2BB673; --done-soft:#DDF5E9; --off:#ECEDF5;
  --font-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12142A; --surface:#1C1F3A; --ink:#EEF0FF; --muted:#9DA2C8; --line:#2C3058;
  --flame:#FF8A33; --flame-2:#FFCF57; --done:#3DD68C; --done-soft:#173A2C; --off:#262A4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12142A; --surface:#1C1F3A; --ink:#EEF0FF; --muted:#9DA2C8; --line:#2C3058;
  --flame:#FF8A33; --flame-2:#FFCF57; --done:#3DD68C; --done-soft:#173A2C; --off:#262A4A; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
.wrap{max-width:520px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--font-display);margin:0;text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{font-size:1.25rem;font-weight:800}
.stats{display:flex;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:.9rem}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 18px;display:flex;align-items:center;gap:18px}
.flame{width:84px;height:96px;flex:none}
.flame.cold path{fill:var(--off)}
.big{font-family:var(--font-display);font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hero .sub{color:var(--muted);font-size:.95rem}
.hero .best{margin-top:6px;font-size:.85rem;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayb{appearance:none;border:2px solid transparent;background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:inherit}
.dayb .dn{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dot{width:26px;height:26px;border-radius:50%;background:var(--off);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.dot.ok{background:linear-gradient(160deg,var(--flame-2),var(--flame));color:#fff}
.dot.part{background:var(--done-soft);color:var(--done)}
.dot.rest{background:transparent;border:2px dashed var(--line)}
.dayb.sel{border-color:var(--flame)}
.dayb:disabled{opacity:.45;cursor:default}
.dayb:focus-visible,.habit:focus-visible,button:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
.goal{display:flex;flex-direction:column;gap:8px}
.goalrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goalrow h2{font-size:1.15rem}
.goalrow span{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.bar{height:14px;background:var(--off);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--flame-2),var(--flame));border-radius:999px;transition:width .35s ease}
.list{display:flex;flex-direction:column;gap:8px}
.habit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;appearance:none;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer;transition:transform .08s}
.habit:active{transform:translateY(2px)}
.habit .chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.habit .txt{flex:1;min-width:0}
.habit .name{font-weight:700}
.habit .when{font-size:.82rem;color:var(--muted)}
.habit .xp{font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.habit.on{border-color:var(--done);background:var(--done-soft)}
.habit.on .chk{background:var(--done);border-color:var(--done)}
.habit.on .chk::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.habit.on .xp{color:var(--done)}
.note{font-size:.85rem;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem}
@media (prefers-reduced-motion: reduce){.bar i,.habit{transition:none}}
</style>

<div class="wrap">
  <div class="top">
    <h1>Mi racha</h1>
    <div class="stats">
      <span class="stat" title="Puntos de experiencia">⚡ <b id="xp">0</b> XP</span>
      <span class="stat" title="Nivel">Nv <b id="lvl">1</b></span>
    </div>
  </div>

  <section class="hero" aria-live="polite">
    <svg class="flame cold" id="flame" viewBox="0 0 84 96" aria-hidden="true">
      <defs><linearGradient id="fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--flame)"/><stop offset="1" style="stop-color:var(--flame-2)"/></linearGradient></defs>
      <path fill="url(#fg)" d="M42 4c4 14 22 24 26 44 4 22-10 44-26 44S12 74 16 52c2-12 10-18 12-28 6 6 6 14 6 18 6-8 10-22 8-38z"/>
      <path fill="#FFF3D6" opacity=".85" d="M42 52c4 8 12 12 12 22 0 8-6 14-12 14s-12-6-12-14c0-6 4-10 6-14 2 4 4 6 4 8 2-4 4-10 2-16z"/>
    </svg>
    <div>
      <div class="big" id="streak">0</div>
      <div class="sub" id="streakTxt">días de racha</div>
      <div class="best" id="best">Mejor racha: 0 días</div>
    </div>
  </section>

  <div class="week" id="week" role="group" aria-label="Últimos 7 días"></div>

  <section class="goal">
    <div class="goalrow"><h2 id="dayTitle">Hoy</h2><span id="goalTxt">0 / 3 para mantener la racha</span></div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <div class="list" id="list"></div>

  <p class="note" id="note">Marca al menos 3 misiones al día para sumar a tu racha. Sábado y domingo no la rompen.</p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const HABITS=[
  {k:"celular",name:"Celular lejos al despertar",when:"7:00"},
  {k:"leetcode",name:"LeetCode",when:"7:40 – 8:40"},
  {k:"grabacion",name:"Grabarme explicando",when:"8:40 · 1 a 3 min"},
  {k:"revisar",name:"Revisar grabación de ayer",when:"Huecos del trabajo"},
  {k:"lecturas",name:"Lecturas (2 o 3)",when:"8:40 y huecos del trabajo"},
  {k:"ingles",name:"Vocabulario de inglés",when:"Huecos del trabajo"},
  {k:"vozalta",name:"Leer en voz alta",when:"19:00 · 10 a 15 min"},
  {k:"proyecto",name:"Proyecto o curso",when:"21:00 – 22:30"},
  {k:"reto",name:"Reto con gente",when:"Cuando surja"}
];
const GOAL=3, XP_PER=10, XP_LEVEL=200;
const DN=["dom","lun","mar","mié","jue","vie","sáb"];
const MN=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
let days={}; // "YYYY-MM-DD" -> {habit:true}
let sel=key(new Date());
let col=null, canSave=false;
const pending={};

function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function count(k){const h=days[k]||{};return HABITS.filter(x=>h[x.k]).length}
function isWeekend(d){const w=d.getDay();return w===0||w===6}

function streaks(){
  const today=new Date();
  let cur=0,d=new Date(today);
  if(count(key(d))<GOAL) d=addDays(d,-1);
  for(let i=0;i<2000;i++){
    const k=key(d);
    if(count(k)>=GOAL){cur++}
    else if(!isWeekend(d)) break;
    d=addDays(d,-1);
  }
  const keys=Object.keys(days).filter(k=>count(k)>0).sort();
  let best=cur;
  if(keys.length){
    const [y,m,dd]=keys[0].split("-").map(Number);
    let run=0; d=new Date(y,m-1,dd);
    while(d<=today){
      if(count(key(d))>=GOAL){run++;best=Math.max(best,run)}
      else if(!isWeekend(d) && key(d)!==key(today)) run=0;
      d=addDays(d,1);
    }
  }
  return {cur,best};
}

function render(){
  const today=new Date(), tk=key(today);
  const {cur,best}=streaks();
  document.getElementById("streak").textContent=cur;
  document.getElementById("streakTxt").textContent=cur===1?"día de racha":"días de racha";
  document.getElementById("best").textContent="Mejor racha: "+best+(best===1?" día":" días");
  document.getElementById("flame").classList.toggle("cold",count(tk)<GOAL);
  const xp=Object.keys(days).reduce((s,k)=>s+count(k)*XP_PER,0);
  document.getElementById("xp").textContent=xp;
  document.getElementById("lvl").textContent=Math.floor(xp/XP_LEVEL)+1;

  const wk=document.getElementById("week"); wk.textContent="";
  for(let i=6;i>=0;i--){
    const d=addDays(today,-i), k=key(d), c=count(k);
    const b=document.createElement("button");
    b.type="button"; b.className="dayb"+(k===sel?" sel":""); b.id="day-"+k;
    b.setAttribute("aria-pressed",k===sel?"true":"false");
    b.setAttribute("aria-label",DN[d.getDay()]+" "+d.getDate()+": "+c+" misiones");
    const dn=document.createElement("span"); dn.className="dn"; dn.textContent=i===0?"hoy":DN[d.getDay()];
    const dot=document.createElement("span");
    dot.className="dot"+(c>=GOAL?" ok":c>0?" part":isWeekend(d)?" rest":"");
    dot.textContent=c>=GOAL?"✓":d.getDate();
    b.append(dn,dot);
    b.onclick=()=>{sel=k;render()};
    wk.append(b);
  }

  const [y,m,dd]=sel.split("-").map(Number), sd=new Date(y,m-1,dd), c=count(sel);
  document.getElementById("dayTitle").textContent=sel===tk?"Misiones de hoy":DN[sd.getDay()]+" "+dd+" "+MN[m-1];
  document.getElementById("goalTxt").textContent=c>=GOAL?c+" / "+HABITS.length+" · racha asegurada":c+" / "+GOAL+" para mantener la racha";
  document.getElementById("barFill").style.width=Math.min(100,c/GOAL*100)+"%";

  const list=document.getElementById("list"); list.textContent="";
  const h=days[sel]||{};
  HABITS.forEach(x=>{
    const b=document.createElement("button");
    b.type="button"; b.id="h-"+x.k; b.className="habit"+(h[x.k]?" on":"");
    b.setAttribute("aria-pressed",h[x.k]?"true":"false");
    b.innerHTML='<span class="chk"></span><span class="txt"><div class="name"></div><div class="when"></div></span><span class="xp">+'+XP_PER+' XP</span>';
    b.querySelector(".name").textContent=x.name;
    b.querySelector(".when").textContent=x.when;
    b.onclick=()=>toggle(x.k);
    list.append(b);
  });
}

let toastT;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

function toggle(hk){
  const k=sel, before=count(k);
  const h=Object.assign({},days[k]||{}); h[hk]=!h[hk];
  days=Object.assign({},days,{[k]:h});
  const after=count(k);
  if(before<GOAL&&after>=GOAL) toast(k===key(new Date())?"¡Racha asegurada por hoy! 🔥":"Día completado ✓");
  render();
  save(k);
}

function save(k){
  if(!col||!canSave) return;
  const body={date:k,habits:Object.assign({},days[k]||{})};
  pending[k]=(pending[k]||Promise.resolve()).then(()=>col.doc(k).set(body)).catch(e=>{
    if(e&&e.code==="quota_exceeded") toast("No hay espacio para guardar más días");
    else if(e&&e.code==="invalid_argument"){canSave=false;showNote("No tienes permiso para guardar en esta página.")}
    else toast("No se pudo guardar. Intenta de nuevo.");
  });
}
function showNote(t){document.getElementById("note").textContent=t}

render();

(async()=>{
  if(!window.claude||!claude.use){showNote("Abre esta página en Claude para guardar tu progreso.");return}
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  const uid=user?await user.id():null;
  if(!db||!uid){showNote("Inicia sesión en Claude para guardar tu racha. Por ahora tus marcas no se guardan.");return}
  col=db.collection("data/users/"+uid); canSave=true;
  col.onSnapshot(snap=>{
    const next={};
    snap.docs.forEach(d=>{const v=d.data();if(v&&v.habits)next[d.id]=v.habits});
    days=next; render();
  },e=>{showNote("Se perdió la conexión con tu progreso. Recarga la página.")});
})();
</script>
