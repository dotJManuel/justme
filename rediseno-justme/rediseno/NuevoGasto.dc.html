<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agregar — Nuevo gasto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; {{vars}}; background: var(--bg); color: var(--tx); font-family: Geist, ui-sans-serif, system-ui, sans-serif">
  <div aria-hidden="true" style="padding: 56px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="height: 36px; width: 140px; border-radius: 8px; background: var(--s3)"></div>
    <div style="height: 44px; border-radius: 10px; background: var(--s2)"></div>
    <div style="height: 150px; border-radius: 12px; background: var(--sf)"></div>
    <div style="height: 200px; border-radius: 12px; background: var(--sf)"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--ov)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="ng-h" style="position: absolute; left: 0; right: 0; bottom: 0; top: 112px; border-radius: 24px 24px 0 0; background: var(--sf); box-shadow: var(--sh2); padding: 8px 16px 34px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 999px; background: var(--bd2); align-self: center"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 id="ng-h" style="margin: 0; font-size: 20px; font-weight: 700">Agregar</h2>
      <a href="Finanzas.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--tx2); background: var(--s2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>

    <div role="tablist" aria-label="Tipo de registro" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; gap: 2px; border-radius: 10px; background: var(--s2)">
      <button role="tab" aria-selected="true" style="height: 38px; border: 0; border-radius: 8px; background: var(--sf); color: var(--tx); font-size: 14px; font-weight: 600; box-shadow: var(--sh1)">Gasto</button>
      <button role="tab" aria-selected="false" style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: var(--tx2); font-size: 14px; font-weight: 500">Préstamo</button>
      <button role="tab" aria-selected="false" style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: var(--tx2); font-size: 14px; font-weight: 500">Familia</button>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0">
      <label for="ng-monto" style="font-size: 13px; font-weight: 600; color: var(--tx2)">Monto</label>
      <input id="ng-monto" inputmode="decimal" value="$610.00" style="width: 100%; border: 0; background: transparent; text-align: center; color: var(--tx); font: inherit; font-size: 44px; line-height: 52px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; outline: none">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="ng-concepto" style="font-size: 13px; font-weight: 600; color: var(--tx2)">Concepto</label>
      <input id="ng-concepto" value="shein botas" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 10px; background: var(--bg); color: var(--tx); font: inherit; font-size: 16px; box-shadow: inset 0 0 0 1.5px var(--ac)">
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <button style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--s2); color: var(--tx2); font-size: 13px; font-weight: 500">Netflix</button>
        <button style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--s2); color: var(--tx2); font-size: 13px; font-weight: 500">Recarga</button>
        <button style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--s2); color: var(--tx2); font-size: 13px; font-weight: 500">Amazon</button>
      </div>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--tx2)">Pagar con</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button aria-pressed="false" style="height: 44px; border: 0; border-radius: 10px; background: var(--sf); color: var(--tx); font-size: 14px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--bd2)">BBVA</button>
        <button aria-pressed="true" style="height: 44px; border: 0; border-radius: 10px; background: var(--acs); color: var(--ac); font-size: 14px; font-weight: 700; box-shadow: inset 0 0 0 2px var(--ac)">Santander</button>
        <button aria-pressed="false" style="height: 44px; border: 0; border-radius: 10px; background: var(--sf); color: var(--tx); font-size: 14px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--bd2)">Gasto fijo</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--tx2)">Meses sin intereses</legend>
      <div style="display: grid; grid-template-columns: 1.6fr repeat(4, minmax(0, 1fr)); gap: 6px">
        <button aria-pressed="true" style="height: 44px; border: 0; border-radius: 10px; background: var(--acs); color: var(--ac); font-size: 14px; font-weight: 700; box-shadow: inset 0 0 0 2px var(--ac)">Contado</button>
        <button aria-pressed="false" style="height: 44px; border: 0; border-radius: 10px; background: var(--sf); color: var(--tx); font-size: 14px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--bd2)">3</button>
        <button aria-pressed="false" style="height: 44px; border: 0; border-radius: 10px; background: var(--sf); color: var(--tx); font-size: 14px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--bd2)">6</button>
        <button aria-pressed="false" style="height: 44px; border: 0; border-radius: 10px; background: var(--sf); color: var(--tx); font-size: 14px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--bd2)">9</button>
        <button aria-pressed="false" style="height: 44px; border: 0; border-radius: 10px; background: var(--sf); color: var(--tx); font-size: 14px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--bd2)">12</button>
      </div>
    </fieldset>

    <button style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0; border: 0; background: transparent; color: var(--tx2); font-size: 14px; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5A1.5 1.5 0 0 1 5.5 5h13A1.5 1.5 0 0 1 20 6.5v12a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5zM4 10h16M8 3v4M16 3v4"></path></svg>
      <span style="flex: 1">Hoy, 23:18</span>
      <span style="color: var(--ac); font-weight: 600">Cambiar</span>
    </button>

    <div style="flex: 1"></div>
    <button style="height: 52px; border: 0; border-radius: 12px; background: var(--ac); color: var(--onac); font-size: 16px; font-weight: 700">Guardar gasto</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const TK={
light:{bg:'#F3F5F8',sf:'#FFFFFF',s2:'#EBEFF4',s3:'#DFE5EC',bd:'#E1E6EC',bd2:'#C7D0DA',tx:'#141C26',tx2:'#475567',tx3:'#5B6A7C',ac:'#2E5781',ach:'#24476B',acs:'#E4ECF5',onac:'#FFFFFF',or:'#B5440A',orf:'#F47B2A',orf2:'#FFB547',ors:'#FFF0E5',gr:'#17794A',grf:'#22A06B',grs:'#E3F3EA',rd:'#C0362F',rds:'#FBEAE8',yl:'#8F5B00',yls:'#FFF3D6',ink:'#141C26',sh1:'0 1px 2px rgba(20,28,38,.06)',sh2:'0 1px 2px rgba(20,28,38,.05), 0 8px 24px rgba(20,28,38,.10)',ov:'rgba(14,19,26,.45)'},
dark:{bg:'#0E131A',sf:'#161D26',s2:'#1E2732',s3:'#273240',bd:'#232D39',bd2:'#33404F',tx:'#E7ECF2',tx2:'#AAB6C4',tx3:'#8696A8',ac:'#8FB6DE',ach:'#A9C7E6',acs:'#1C2B3B',onac:'#0E131A',or:'#FF9550',orf:'#FF8A3D',orf2:'#FFB547',ors:'#2E1E14',gr:'#4CC68A',grf:'#3DB57A',grs:'#15291F',rd:'#F27A72',rds:'#2E1A1B',yl:'#F0B44C',yls:'#2B2314',ink:'#1A0F08',sh1:'0 1px 2px rgba(0,0,0,.4)',sh2:'0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35)',ov:'rgba(0,0,0,.6)'}};
class Component extends DCLogic {
  renderVals() {
    const t = TK[this.props.dark ? 'dark' : 'light'];
    return { vars: Object.keys(t).map((k) => '--' + k + ':' + t[k]).join(';') };
  }
}
</script>
</body>
</html>
