<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Finanzas — Por cobrar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; {{vars}}; background: var(--bg); color: var(--tx); font-family: Geist, ui-sans-serif, system-ui, sans-serif">
  <div style="padding: 56px 16px 120px; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">Finanzas</h1>
      <button aria-label="Buscar personas o movimientos" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--tx2); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg></button>
    </header>

    <nav aria-label="Secciones de finanzas" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 3px; gap: 2px; border-radius: 10px; background: var(--s2)">
      <a href="Finanzas.dc.html" style="height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--tx2); font-size: 13px; font-weight: 500; text-decoration: none">Resumen</a>
      <a href="Tarjeta.dc.html" style="height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--tx2); font-size: 13px; font-weight: 500; text-decoration: none">Tarjetas</a>
      <a href="PorCobrar.dc.html" aria-current="page" style="height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--sf); color: var(--tx); font-size: 13px; font-weight: 600; text-decoration: none; box-shadow: var(--sh1)">Por cobrar</a>
      <a href="#" style="height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--tx2); font-size: 13px; font-weight: 500; text-decoration: none">Familia</a>
    </nav>

    <section aria-label="Total por cobrar" style="display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 12px; background: var(--sf); box-shadow: var(--sh1), inset 0 0 0 1px var(--bd)">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; font-weight: 600; color: var(--tx2)">Te deben</span>
        <span style="font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.025em; font-variant-numeric: tabular-nums">$12,340.00</span>
      </div>
      <div style="height: 6px; border-radius: 999px; background: var(--s2); overflow: hidden"><div style="width: 50%; height: 100%; background: var(--gr); border-radius: 999px"></div></div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: var(--tx2); font-variant-numeric: tabular-nums">
        <span>Cobrado <strong style="color: var(--gr); font-weight: 600">$12,104.00</strong></span>
        <span>de $24,444.00 prestado</span>
      </div>
    </section>

    <section aria-labelledby="pp-h" style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
        <h2 id="pp-h" style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--tx3)">Personas · 7</h2>
        <button style="height: 32px; padding: 0 4px; border: 0; background: transparent; color: var(--ac); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px">Mayor saldo<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      </div>
      <div style="display: flex; flex-direction: column; border-radius: 12px; background: var(--sf); box-shadow: inset 0 0 0 1px var(--bd)">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="7">
          <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 52px; text-decoration: none; color: inherit; border-top: {{p.sep}}">
            <div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 999px; background: var(--acs); color: var(--ac); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0">{{p.ini}}</div>
            <div style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0">
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
                <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
                <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{p.due}}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px">
                <div style="flex: 1; height: 4px; border-radius: 999px; background: var(--s2); overflow: hidden"><div style="width: {{p.pct}}; height: 100%; background: var(--gr); border-radius: 999px"></div></div>
                <span style="font-size: 12px; color: var(--tx2); font-variant-numeric: tabular-nums; width: 64px; text-align: right">{{p.pct}} pagado</span>
              </div>
            </div>
          </a>
        </sc-for>
      </div>
    </section>
  </div>

  <nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px 26px; background: var(--sf); box-shadow: 0 -1px 0 var(--bd); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <a href="Inicio.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; min-height: 44px; text-decoration: none; color: var(--tx2); font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.home}}"></path></svg>Hoy</a>
    <a href="Racha.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; min-height: 44px; text-decoration: none; color: var(--tx2); font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.flame}}"></path></svg>Racha</a>
    <div style="display: flex; justify-content: center"><a href="NuevoGasto.dc.html" aria-label="Agregar" style="width: 52px; height: 52px; border-radius: 18px; background: var(--ac); color: var(--onac); display: flex; align-items: center; justify-content: center; box-shadow: var(--sh2)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.plus}}"></path></svg></a></div>
    <a href="Finanzas.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; min-height: 44px; text-decoration: none; color: var(--ac); font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.wallet}}"></path></svg>Finanzas</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; min-height: 44px; text-decoration: none; color: var(--tx2); font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.user}}"></path></svg>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const TK={
light:{bg:'#F3F5F8',sf:'#FFFFFF',s2:'#EBEFF4',s3:'#DFE5EC',bd:'#E1E6EC',bd2:'#C7D0DA',tx:'#141C26',tx2:'#475567',tx3:'#5B6A7C',ac:'#2E5781',ach:'#24476B',acs:'#E4ECF5',onac:'#FFFFFF',or:'#B5440A',orf:'#F47B2A',orf2:'#FFB547',ors:'#FFF0E5',gr:'#17794A',grf:'#22A06B',grs:'#E3F3EA',rd:'#C0362F',rds:'#FBEAE8',yl:'#8F5B00',yls:'#FFF3D6',ink:'#141C26',sh1:'0 1px 2px rgba(20,28,38,.06)',sh2:'0 1px 2px rgba(20,28,38,.05), 0 8px 24px rgba(20,28,38,.10)',ov:'rgba(14,19,26,.45)'},
dark:{bg:'#0E131A',sf:'#161D26',s2:'#1E2732',s3:'#273240',bd:'#232D39',bd2:'#33404F',tx:'#E7ECF2',tx2:'#AAB6C4',tx3:'#8696A8',ac:'#8FB6DE',ach:'#A9C7E6',acs:'#1C2B3B',onac:'#0E131A',or:'#FF9550',orf:'#FF8A3D',orf2:'#FFB547',ors:'#2E1E14',gr:'#4CC68A',grf:'#3DB57A',grs:'#15291F',rd:'#F27A72',rds:'#2E1A1B',yl:'#F0B44C',yls:'#2B2314',ink:'#1A0F08',sh1:'0 1px 2px rgba(0,0,0,.4)',sh2:'0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35)',ov:'rgba(0,0,0,.6)'}};
const IC={home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',flame:'M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z',wallet:'M3 7a2 2 0 0 1 2-2h12v4M3 7v10a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2zM16 14h.01',plus:'M12 5v14M5 12h14',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20a7.5 7.5 0 0 1 15 0'};
class Component extends DCLogic {
  renderVals() {
    const t = TK[this.props.dark ? 'dark' : 'light'];
    const P = [['Ismael','IS','$4,227.00','56%'],['YOSS prestado','YP','$2,200.00','0%'],['YO','YO','$2,048.00','31%'],['mm','MM','$2,000.00','0%'],['YOS pasado','YS','$1,119.00','64%'],['Angeles','AN','$716.00','84%'],['Celeste','CE','$30.00','0%']];
    const people = P.map(([name, ini, due, pct], i) => ({ name, ini, due, pct, sep: i ? '1px solid var(--bd)' : '0' }));
    return { vars: Object.keys(t).map((k) => '--' + k + ':' + t[k]).join(';'), ic: IC, people };
  }
}
</script>
</body>
</html>
