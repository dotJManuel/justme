<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Racha — Logros y nivel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; {{vars}}; background: var(--bg); color: var(--tx); font-family: Geist, ui-sans-serif, system-ui, sans-serif">
  <div style="padding: 56px 16px 120px; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">Racha</h1>
      <div style="display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: var(--s2)">
        <a href="Racha.dc.html" style="height: 36px; padding: 0 16px; display: flex; align-items: center; border-radius: 999px; color: var(--tx2); font-size: 14px; font-weight: 500; text-decoration: none">Hoy</a>
        <a href="Logros.dc.html" aria-current="page" style="height: 36px; padding: 0 16px; display: flex; align-items: center; border-radius: 999px; background: var(--sf); color: var(--tx); font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: var(--sh1)">Logros</a>
      </div>
    </header>

    <section aria-label="Nivel" style="display: flex; align-items: center; gap: 18px; padding: 20px; border-radius: 24px; background: var(--sf); box-shadow: var(--sh1), inset 0 0 0 1px var(--bd)">
      <div style="position: relative; width: 88px; height: 88px; flex-shrink: 0">
        <svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true">
          <circle cx="44" cy="44" r="38" fill="none" stroke-width="8" style="stroke: var(--s2)"></circle>
          <circle cx="44" cy="44" r="38" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="167.1 238.8" transform="rotate(-90 44 44)" style="stroke: var(--orf)"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--tx2)">NIVEL</span>
          <span style="font-size: 28px; line-height: 30px; font-weight: 800; font-variant-numeric: tabular-nums">2</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; flex: 1">
        <span style="font-size: 18px; font-weight: 700">Constante</span>
        <span style="font-size: 14px; color: var(--tx2); font-variant-numeric: tabular-nums"><strong style="color: var(--tx)">210</strong> / 300 XP</span>
        <span style="font-size: 13px; color: var(--or); font-weight: 600">90 XP para nivel 3</span>
      </div>
    </section>

    <section aria-label="Estadísticas" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 18px; background: var(--sf); box-shadow: inset 0 0 0 1px var(--bd)">
          <span style="font-size: 26px; line-height: 32px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{s.v}}</span>
          <span style="font-size: 13px; color: var(--tx2)">{{s.l}}</span>
        </div>
      </sc-for>
    </section>

    <section aria-labelledby="ins-h" style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 id="ins-h" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 700">Insignias</h2>
        <span style="font-size: 14px; color: var(--tx2)">2 de 6</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{badges}}" as="b" hint-placeholder-count="6">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px 14px; border-radius: 20px; background: var(--sf); box-shadow: inset 0 0 0 1px var(--bd); text-align: center">
            <div style="width: 56px; height: 56px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{b.bg}}; color: {{b.fg}}">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg>
            </div>
            <span style="font-size: 13px; line-height: 16px; font-weight: 600; color: {{b.tc}}">{{b.name}}</span>
            <span style="font-size: 12px; line-height: 16px; color: var(--tx2); font-variant-numeric: tabular-nums">{{b.sub}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </div>

  <nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px 26px; background: var(--sf); box-shadow: 0 -1px 0 var(--bd); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <a href="Inicio.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; min-height: 44px; text-decoration: none; color: var(--tx2); font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.home}}"></path></svg>Hoy</a>
    <a href="Racha.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; min-height: 44px; text-decoration: none; color: var(--or); font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.flame}}" style="fill: var(--orf)"></path></svg>Racha</a>
    <div style="display: flex; justify-content: center"><a href="NuevoGasto.dc.html" aria-label="Agregar" style="width: 52px; height: 52px; border-radius: 18px; background: var(--ac); color: var(--onac); display: flex; align-items: center; justify-content: center; box-shadow: var(--sh2)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.plus}}"></path></svg></a></div>
    <a href="Finanzas.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; min-height: 44px; text-decoration: none; color: var(--tx2); font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.wallet}}"></path></svg>Finanzas</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; min-height: 44px; text-decoration: none; color: var(--tx2); font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.user}}"></path></svg>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const TK={
light:{bg:'#F3F5F8',sf:'#FFFFFF',s2:'#EBEFF4',s3:'#DFE5EC',bd:'#E1E6EC',bd2:'#C7D0DA',tx:'#141C26',tx2:'#475567',tx3:'#5B6A7C',ac:'#2E5781',ach:'#24476B',acs:'#E4ECF5',onac:'#FFFFFF',or:'#B5440A',orf:'#F47B2A',orf2:'#FFB547',ors:'#FFF0E5',gr:'#17794A',grf:'#22A06B',grs:'#E3F3EA',rd:'#C0362F',rds:'#FBEAE8',yl:'#8F5B00',yls:'#FFF3D6',ink:'#141C26',sh1:'0 1px 2px rgba(20,28,38,.06)',sh2:'0 1px 2px rgba(20,28,38,.05), 0 8px 24px rgba(20,28,38,.10)',ov:'rgba(14,19,26,.45)'},
dark:{bg:'#0E131A',sf:'#161D26',s2:'#1E2732',s3:'#273240',bd:'#232D39',bd2:'#33404F',tx:'#E7ECF2',tx2:'#AAB6C4',tx3:'#8696A8',ac:'#8FB6DE',ach:'#A9C7E6',acs:'#1C2B3B',onac:'#0E131A',or:'#FF9550',orf:'#FF8A3D',orf2:'#FFB547',ors:'#2E1E14',gr:'#4CC68A',grf:'#3DB57A',grs:'#15291F',rd:'#F27A72',rds:'#2E1A1B',yl:'#F0B44C',yls:'#2B2314',ink:'#1A0F08',sh1:'0 1px 2px rgba(0,0,0,.4)',sh2:'0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35)',ov:'rgba(0,0,0,.6)'}};
const IC={home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',flame:'M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z',wallet:'M3 7a2 2 0 0 1 2-2h12v4M3 7v10a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2zM16 14h.01',plus:'M12 5v14M5 12h14',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20a7.5 7.5 0 0 1 15 0'};
class Component extends DCLogic {
  renderVals() {
    const t = TK[this.props.dark ? 'dark' : 'light'];
    const stats = [{ v: '2', l: 'Días de racha' }, { v: '2', l: 'Mejor racha' }, { v: '21', l: 'Misiones hechas' }, { v: '210', l: 'XP totales' }];
    const B = [
      ['Primer paso', 'Ganada', 'M5 12.5l4.5 4.5L19 7.5', true],
      ['Doble racha', 'Ganada', IC.flame, true],
      ['Semana de fuego', '2 / 7 días', 'M4 6.5A1.5 1.5 0 0 1 5.5 5h13A1.5 1.5 0 0 1 20 6.5v12a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5zM4 10h16M8 3v4M16 3v4', false],
      ['Madrugador', 'Celular lejos 7 días', 'M12 3v2M12 19v2M5 12H3M21 12h-2M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', false],
      ['Políglota', 'Vocabulario 10 días', 'M4 5h7M7.5 3v2M5.5 5c0 4 3 7 6 8M10 5c-.5 3-2.5 6-6 8M13 21l4-9 4 9M14.5 18h5', false],
      ['Mes imparable', '2 / 30 días', 'M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7', false]
    ];
    const badges = B.map(([name, sub, icon, got]) => ({ name, sub, icon, bg: got ? 'var(--orf)' : 'var(--s2)', fg: got ? 'var(--ink)' : 'var(--tx3)', tc: got ? 'var(--tx)' : 'var(--tx2)' }));
    return { vars: Object.keys(t).map((k) => '--' + k + ':' + t[k]).join(';'), ic: IC, stats, badges };
  }
}
</script>
</body>
</html>
